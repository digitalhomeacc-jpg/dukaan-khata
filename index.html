<!DOCTYPE html>
<html lang="mr">
<head>
  <base href="/dukaan-khata/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="दुकान खाता – ग्राहक खाते, रोजमेळ आणि स्टॉक">
  <meta name="theme-color" content="#1F4E79">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="दुकान खाता">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>दुकान खाता</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F5F7FA; }
    #splash {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #F5F7FA; color: #1F4E79; transition: opacity .3s ease;
      font-family: "Noto Sans Devanagari", system-ui, sans-serif;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 24px rgba(31,78,121,.18); }
    #splash .name { font-size: 22px; font-weight: 700; }
    #splash .wait { font-size: 14px; color: #5B6B7F; }
    #splash .slow { font-size: 13px; color: #5B6B7F; text-align: center; max-width: 300px; line-height: 1.5; }
    #splash .retry { font: 600 14px sans-serif; color: #fff; background: #1F4E79; border: 0; border-radius: 20px; padding: 10px 18px; }
    #splash .bar { width: 140px; height: 4px; border-radius: 2px; background: #DDE5EE; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #D9822B; border-radius: 2px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #12161C; }
      #splash { color: #9EC3EA; }
      #splash .bar { background: #2A333F; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">दुकान खाता</div>
    <div class="bar"></div>
    <div class="wait">उघडत आहे… · Opening…</div>
    <div class="slow" id="splash-slow" hidden>नवीन आवृत्ती डाउनलोड होत आहे – इंटरनेट हळू असल्यास थोडा वेळ लागतो.<br>A new version is downloading – this takes longer on slow internet.</div>
    <button class="retry" id="splash-retry" hidden>अडकले? पुन्हा उघडा · Stuck? Open again</button>
  </div>
  <script>
    // A slow first open after an update: say what is happening, and after a
    // while offer a clean restart (clears only the saved app files – all
    // entries live in the app's database and are not touched).
    setTimeout(function () { var e = document.getElementById('splash-slow'); if (e && document.getElementById('splash')) e.hidden = false; }, 12000);
    setTimeout(function () {
      var b = document.getElementById('splash-retry');
      if (!b || !document.getElementById('splash')) return;
      b.hidden = false;
      b.onclick = async function () {
        b.disabled = true;
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.filter(function (k) { return k.indexOf('dk-') === 0 || k.indexOf('flutter') >= 0; }).map(function (k) { return caches.delete(k); }));
          }
        } catch (e) {}
        location.reload();
      };
    }, 40000);
  </script>
  <script>
    // Keep the app on the phone so it opens without internet.
    if ('serviceWorker' in navigator) {
      // save the offline copy only once the app is open: then it reuses what
      // the screen just downloaded instead of fetching it again at the same time
      window.dkRegisterSw = function () {
        if (window.dkSwDone) return;
        window.dkSwDone = true;
        navigator.serviceWorker.register('app_sw.js?v=202611131302').catch(function () {});
      };
      setTimeout(window.dkRegisterSw, 60000); // in case the app never says it opened
      window.addEventListener('load', function () {
        // A new version took over: reload once so every file (icons too) comes
        // from the new version. Right after opening this is automatic; later,
        // a small bar asks first so nothing being typed is lost.
        var hadController = !!navigator.serviceWorker.controller;
        var reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController || reloading) return;
          // still opening: never restart it – this opening already uses the new
          // version from the internet; the offline copy is ready for next time
          if (document.getElementById('splash')) return;
          if (document.getElementById('dk-update')) return;
          var b = document.createElement('button');
          b.id = 'dk-update';
          b.textContent = 'नवीन आवृत्ती आली – रीलोड करा / Update ready – tap to reload';
          b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));' +
            'z-index:9999;max-width:92vw;padding:10px 16px;border:0;border-radius:22px;background:#1F4E79;color:#fff;' +
            'font:600 14px sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer';
          b.onclick = function () { reloading = true; location.reload(); };
          document.body.appendChild(b);
        });
      });
    }
  </script>
  <script src="pdf_text.js?v=202611131302" defer></script>
  <script src="flutter_bootstrap.js?v=202611131302" async></script>
</body>
</html>
