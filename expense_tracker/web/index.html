<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Personal expense tracker">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Expense Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Expense Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00897B">
  <style>
    html, body { margin: 0; height: 100%; background: #f4faf8; }
    @media (prefers-color-scheme: dark) { html, body { background: #101413; } #splash { color: #dfe6e3; } }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; font: 16px -apple-system, system-ui, sans-serif; color: #1b2a26; }
    #splash .dot { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #00897B33;
      border-top-color: #00897B; animation: spin 0.9s linear infinite; }
    #splash button { display: none; font: inherit; padding: 10px 22px; border: 0; border-radius: 22px;
      background: #00897B; color: #fff; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // Old copies of the app kept by a service worker can show a white page: remove them.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
      if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    }
    // A newer version published? Load it (iPhone home-screen apps otherwise keep running the old one).
    var BUILD = '__BUILD__';
    function checkVersion() {
      if (BUILD.indexOf('__') === 0) return;
      fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : ''; })
        .then(function (v) {
          v = (v || '').trim();
          if (!v || v === BUILD) return;
          try { if (sessionStorage.getItem('updated-to-' + v)) return; sessionStorage.setItem('updated-to-' + v, '1'); } catch (e) {}
          location.replace(location.pathname + '?v=' + v + location.hash);
        })
        .catch(function () {});
    }
    checkVersion();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) checkVersion(); });
    var started = false;
    window.addEventListener('flutter-first-frame', function () {
      started = true;
      var s = document.getElementById('splash'); if (s) s.remove();
    });
    // Not started after 12 s: offer a reload instead of a blank page.
    setTimeout(function () {
      if (started) return;
      var t = document.getElementById('splash-text'), b = document.getElementById('splash-reload');
      if (t) t.textContent = 'Taking longer than usual…';
      if (b) b.style.display = 'block';
    }, 12000);
    // iPhone: coming back to a page restored from memory, or losing the drawing surface
    // after a while in the background, leaves it white. Reload instead.
    window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
    document.addEventListener('webglcontextlost', function () { setTimeout(function () { location.reload(); }, 300); }, true);
    var hiddenAt = 0;
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { hiddenAt = Date.now(); return; }
      if (hiddenAt && Date.now() - hiddenAt > 30 * 60 * 1000) location.reload();
    });
  </script>
</head>
<body>
  <div id="splash">
    <div class="dot"></div>
    <div id="splash-text">Loading Expense Tracker…</div>
    <button id="splash-reload" onclick="location.reload()">Reload</button>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
